<!doctype html>
<html lang="ja"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><meta name="theme-color" content="#f8f6ef"><title>フォームメイト | スマホ体験モック</title><meta name="description" content="睡眠と回復から今日の練習へ。好きなコーチや仲間と続けるFormMateの22画面を触れるローカルモック。"><link rel="icon" href="../favicon.svg" type="image/svg+xml"><link rel="stylesheet" href="./styles.css"><link rel="stylesheet" href="./premium.css"><script type="module" src="./app.mjs?v=20261106-natural-2"></script></head>
<body>
<a class="skip-link" href="#app">アプリ画面へ</a>
<div class="workspace">
  <aside class="project-intro">
    <a href="../" class="wordmark">formmate<span>✳</span></a><span class="overline">MOBILE EXPERIENCE</span>
    <h1>からだを知る。<br>一歩が、変わる。</h1>
    <p>好きなコーチと、同じ目標の仲間と。<br>あなたのペースで続ける<br>トレーニングの、新しいかたち。</p>
    <div class="intro-note"><span>✧</span><p>ホームから、今日のプランへ。<br>睡眠と回復に合わせたプレミアム体験。</p></div>
    <a class="back-to-site" href="../">← サービス紹介に戻る</a>
  </aside>
  <div class="phone" aria-label="フォームメイトのスマホモック">
    <div class="statusbar"><span>9:41</span><span class="dynamic-island"></span><span aria-hidden="true">▮▮▮ ︿ ▰</span></div>
    <main id="app" class="screen" tabindex="-1"></main><nav id="tabs" class="tabs" aria-label="アプリのタブ"></nav>
  </div>
  <aside class="inspector">
    <span class="overline">PROTOTYPE GUIDE</span>
    <div class="inspector-heading"><h2>体験を、ひとめぐり。</h2><span>22 screens</span></div>
    <p>すべてサンプルです。入力や操作の内容が<br>外部に送信されることはありません。</p>
    <button class="premium-shortcut" data-action="navigate" data-value="P01">✧ 睡眠・回復のプレミアム体験へ →</button>
    <div id="screen-list" class="screen-list" aria-label="画面ナビゲーター"></div>
    <details class="mock-controls"><summary>モックの状態を試す</summary>
      <button data-action="check" data-value="insufficient">初回チェック：判定不足</button>
      <button data-action="unassessable">練習：撮り直し</button>
      <button data-action="team" data-value="joined">チーム：参加済みの例</button>
      <button data-action="schedule" data-field="status" data-value="confirmed">約練日：開催決定の例</button>
      <button data-action="reward" data-value="eligible">特典：条件達成の例</button>
      <button data-action="reset">最初からやり直す</button>
    </details>
    <span class="inspector-footer">LOCAL MOCK · NO EXTERNAL CONNECTIONS</span>
  </aside>
</div>
<div id="toast" role="status" class="toast" hidden></div>
<noscript><p class="noscript">この操作モックにはJavaScriptが必要です。JavaScriptを有効にして再度開いてください。</p></noscript>
</body></html>
